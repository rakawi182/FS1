<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02040a">
<title>FS1 · Spectral Core</title>
<style>
:root{
  --bg:#02040a; --pn:rgba(7,13,26,.78); --ln:#152a4d; --ln2:#24467e;
  --tx:#cfe0ff; --mu:#6b82ad; --c1:#5cf2ff; --c2:#ffb347; --c3:#ff5cc8; --c4:#5cff9d;
  --ff:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);
  font:12px/1.45 var(--ff);overscroll-behavior:none}
canvas#stage{position:absolute;left:0;right:0;display:block;touch-action:none;cursor:crosshair;z-index:1}

.panel{
  position:fixed;background:var(--pn);border:1px solid var(--ln);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:0 0 44px rgba(0,0,0,.65), inset 0 0 34px rgba(92,242,255,.045);
  clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px);
  z-index:10;
}
.ph{display:flex;align-items:center;gap:8px;padding:6px 9px;font-size:9.5px;letter-spacing:.16em;
  color:var(--c1);border-bottom:1px solid var(--ln);text-transform:uppercase;flex:none}
.ph b{margin-left:auto;color:var(--mu);font-weight:400;letter-spacing:.06em}

#top{position:fixed;left:0;right:0;top:0;height:44px;display:flex;align-items:center;gap:12px;
  padding:0 12px 0 14px;z-index:30;
  background:linear-gradient(180deg,rgba(3,6,14,.97),rgba(3,6,14,.45));
  border-bottom:1px solid var(--ln);-webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px)}
#brand{font-size:13px;letter-spacing:.24em;color:var(--c1);text-shadow:0 0 14px rgba(92,242,255,.75);white-space:nowrap}
#brand b{color:var(--c2);text-shadow:0 0 14px rgba(255,179,71,.75)}
#brand s{display:block;text-decoration:none;font-size:8.5px;letter-spacing:.16em;color:var(--mu);margin-top:-1px}
#modes{display:flex;gap:5px;margin:0 auto}
#modes button,#tgl{font:inherit;font-size:9.5px;letter-spacing:.13em;color:var(--mu);
  background:rgba(10,17,34,.75);border:1px solid var(--ln);border-radius:3px;padding:6px 10px;cursor:pointer;white-space:nowrap}
#modes button.on{color:#02040a;background:var(--c1);border-color:var(--c1);box-shadow:0 0 16px rgba(92,242,255,.6)}
#tgl{color:var(--mu)}
#tgl.on{color:var(--c1);border-color:var(--c1)}
#stat{display:flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.1em;color:var(--mu);white-space:nowrap}
#led{width:7px;height:7px;border-radius:50%;background:var(--c4);box-shadow:0 0 10px var(--c4);animation:bl 2.4s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}

#left{left:10px;top:54px;width:206px;bottom:136px;display:flex;flex-direction:column}
#vlist{overflow:auto;padding:5px;display:flex;flex-direction:column;gap:3px;scrollbar-width:thin}
#vlist::-webkit-scrollbar{width:5px}#vlist::-webkit-scrollbar-thumb{background:var(--ln2);border-radius:3px}
.vi{display:grid;grid-template-columns:34px 1fr;gap:6px;align-items:center;padding:4px 6px;cursor:pointer;
  border:1px solid transparent;border-radius:3px;background:rgba(11,19,38,.5);transition:.14s}
.vi:hover{border-color:var(--ln2);background:rgba(20,36,68,.6)}
.vi.on{border-color:var(--c1);background:rgba(92,242,255,.11);box-shadow:0 0 16px rgba(92,242,255,.18) inset}
.vi .sy{font-size:11.5px;color:var(--c1);letter-spacing:.04em}
.vi.on .sy{color:#fff}
.vi.ovl .sy{color:#5cff9d}
.vi.ovl{background:rgba(92,255,157,.08);border-color:rgba(92,255,157,.35)}
.vi.ovl2 .sy{color:#c88cff}
.vi.ovl2{background:rgba(200,140,255,.08);border-color:rgba(200,140,255,.35)}
.vi.ovl3 .sy{color:#fff}
.vi.ovl3{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.3)}
.vi .nm{font-size:8.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vi .rb{grid-column:1/-1;height:2px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
.vi .rb i{display:block;height:100%;background:linear-gradient(90deg,var(--c3),var(--c1))}

#right{right:10px;top:54px;width:246px;bottom:136px;display:flex;flex-direction:column}
#tele{overflow:auto;padding:8px 10px;font-size:10.5px;scrollbar-width:thin}
#tele::-webkit-scrollbar{width:5px}#tele::-webkit-scrollbar-thumb{background:var(--ln2);border-radius:3px}
.tbig{display:flex;align-items:baseline;gap:7px;margin-bottom:1px}
.tbig .sy{font-size:20px;color:#fff;letter-spacing:.02em;text-shadow:0 0 18px rgba(92,242,255,.8)}
.tbig .id{font-size:9px;color:var(--c2);letter-spacing:.18em}
.tnm{font-size:9px;color:var(--mu);margin-bottom:8px;line-height:1.3}
.kv{display:flex;justify-content:space-between;gap:8px;padding:2.5px 0;border-bottom:1px dotted rgba(36,70,126,.4)}
.kv span{color:var(--mu);font-size:9px;letter-spacing:.09em}
.kv b{color:var(--tx);font-weight:400}
.kv b i{color:var(--c1);font-style:normal}
.kv b u{color:var(--c2);text-decoration:none}
.bars{margin:9px 0 4px;display:flex;flex-direction:column;gap:5px}
.bar{position:relative;height:12px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,rgba(92,242,255,.85),rgba(92,242,255,.25))}
.bar.b2 i{background:linear-gradient(90deg,rgba(255,179,71,.85),rgba(255,179,71,.25))}
.bar.b3 i{background:linear-gradient(90deg,rgba(255,92,200,.85),rgba(255,92,200,.25))}
.bar em{position:absolute;left:6px;top:0;line-height:12px;font-style:normal;font-size:8.5px;
  letter-spacing:.08em;color:#dff0ff;text-shadow:0 0 6px #000}
.tsec{margin-top:9px;padding-top:6px;border-top:1px solid var(--ln);font-size:8.5px;letter-spacing:.14em;color:var(--mu)}

#bottom{left:10px;right:10px;bottom:10px;height:118px;display:flex;flex-direction:column}
#strip{flex:1 1 0;min-height:0;width:100%;display:block;touch-action:none;cursor:ew-resize}
#play{font:inherit;font-size:10px;color:var(--c2);background:none;border:1px solid var(--ln2);
  border-radius:3px;padding:2px 9px;cursor:pointer;letter-spacing:.1em}
#play.on{color:#02040a;background:var(--c2);border-color:var(--c2);box-shadow:0 0 14px rgba(255,179,71,.6)}
#daylbl{margin-left:auto;color:var(--c2);letter-spacing:.08em;font-size:9.5px}
#rings{display:flex;gap:3px;margin-left:6px}
#rings button{font:inherit;font-size:8.5px;letter-spacing:.08em;color:var(--mu);
  background:rgba(10,17,34,.75);border:1px solid var(--ln);border-radius:3px;
  padding:2px 6px;cursor:pointer;white-space:nowrap;line-height:1.2}
#rings button.on{color:#02040a;background:var(--c2);border-color:var(--c2);
  box-shadow:0 0 10px rgba(255,179,71,.5)}

#boot{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;background:#02040a;transition:opacity .6s;text-align:center;padding:20px}
#boot.off{opacity:0;pointer-events:none}
#boot h1{margin:0;font-size:16px;letter-spacing:.42em;color:var(--c1);text-shadow:0 0 22px rgba(92,242,255,.8);font-weight:400}
#boot p{margin:0;font-size:10px;letter-spacing:.2em;color:var(--mu);max-width:420px;line-height:1.9}
#bar{width:230px;height:2px;background:rgba(255,255,255,.08);overflow:hidden}
#bar i{display:block;height:100%;width:36%;background:var(--c1);box-shadow:0 0 12px var(--c1);animation:ld 1.15s infinite}
@keyframes ld{0%{transform:translateX(-110%)}100%{transform:translateX(330%)}}

body.lean #left,body.lean #right,body.lean #bottom{opacity:0;pointer-events:none;transform:translateY(6px)}
#left,#right,#bottom{transition:opacity .3s,transform .3s}

@media(max-width:940px){
  #brand s{display:none}
  #brand{font-size:10.5px;letter-spacing:.16em}
  #modes button{padding:6px 7px;font-size:9px;letter-spacing:.05em}

  #left{left:8px;right:8px;top:52px;bottom:auto;width:auto;height:76px}
  #vlist{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:5px;gap:6px}
  .vi{flex:0 0 auto;width:88px;grid-template-columns:1fr;gap:1px;padding:5px 7px}
  .vi .sy{font-size:11px}

  #right{top:auto;bottom:156px;left:8px;right:8px;width:auto;height:190px;max-height:190px;
    overflow:hidden;min-height:0}
  #tele{padding:6px 8px;min-height:0;flex:1 1 auto;overflow-y:auto}
  .tbig .sy{font-size:16px}
  .tnm{font-size:8px;margin-bottom:4px}
  .kv{padding:1.5px 0}
  .kv span{font-size:8px}
  .kv b{font-size:9px}
  .tsec{margin-top:5px;padding-top:4px;font-size:8px}
  .bars{margin:5px 0 3px;gap:3px}
  .bar{height:10px}
  .bar em{line-height:10px;font-size:7.5px}

  #bottom{left:8px;right:8px;bottom:8px;height:148px}
  #play{padding:1px 6px;font-size:9px}
  #daylbl{font-size:8.5px}
  #rings button{font-size:7px;padding:1px 4px;letter-spacing:0}
  #rings{margin-left:3px;gap:2px}
  #bottom .ph>span:first-child{font-size:8px;letter-spacing:.08em}

  #stat{display:none}
}
@media(max-width:520px){
  #tele{font-size:9.5px}
  #brand{font-size:9.5px;letter-spacing:.12em}
  #boot p{font-size:10px}
}
</style>
</head>
<body>
<canvas id="stage"></canvas>

<header id="top">
  <div id="brand">FS1 <b>//</b> SPECTRAL CORE<s>MJS OBSERVATORY · IFS-HRES 2017–2026</s></div>
  <nav id="modes">
    <button data-m="0" class="on">ENVELOPE</button>
    <button data-m="1">HARMONIC</button>
    <button data-m="2">SPECTRUM</button>
  </nav>
  <button id="tgl" title="sembunyikan panel">◱ UI</button>
  <div id="stat"><span id="led"></span><span id="clock">--:--:--</span>&nbsp;UTC</div>
</header>

<aside id="left" class="panel">
  <div class="ph">◈ VARIABEL<b id="vcnt">—</b></div>
  <div id="vlist"></div>
</aside>

<aside id="right" class="panel">
  <div class="ph">◈ TELEMETRI<b id="tsel">—</b></div>
  <div id="tele"></div>
</aside>

<footer id="bottom" class="panel">
  <div class="ph">
    <span>◈ SIKLUS</span>
    <button id="play">▶ PLAY</button>
    <div id="rings">
      <button data-r="0" class="on">R10H</button>
      <button data-r="1">R10</button>
      <button data-r="2">Trad</button>
    </div>
    <span id="daylbl">—</span>
  </div>
  <canvas id="strip"></canvas>
</footer>

<div id="boot">
  <h1>FS1 · SPECTRAL CORE</h1>
  <div id="bar"><i></i></div>
  <p id="bootmsg">MEMUAT ARSIP KLIMATIK …</p>
</div>

async function fetchObs(){
  const nowMs=Date.now();
  const sd=new Date(nowMs-864e5).toISOString().slice(0,10);
  const ed=new Date(nowMs+864e5).toISOString().slice(0,10);
  const vars=[
    'temperature_2m','dew_point_2m','relative_humidity_2m',
    'vapour_pressure_deficit','surface_pressure','cloud_cover',
    'wind_speed_10m','shortwave_radiation','et0_fao_evapotranspiration',
    'precipitation','soil_moisture_0_to_7cm','soil_moisture_7_to_28cm',
    'sunshine_duration'
  ];
  const p=new URLSearchParams();
  p.set('latitude','-7.521951');
  p.set('longitude','112.566089');
  vars.forEach(v=>p.append('hourly',v));
  p.set('start_date',sd); p.set('end_date',ed);
  p.set('timezone','UTC');
  try{
    const r=await fetch('https://api.open-meteo.com/v1/ecmwf?'+p.toString());
    const j=await r.json();
    if(!j||!j.hourly||!j.hourly.time) return;
    const times=j.hourly.time;
    let bi=0,bd=Infinity;
    for(let i=0;i<times.length;i++){
      const t=new Date(times[i]+'Z').getTime();
      const d=Math.abs(t-nowMs);
      if(d<bd){bd=d;bi=i;}
    }
    const g=n=>{const a=j.hourly[n];return (a&&a[bi]!=null)?a[bi]:null;};
    const put=(id,val)=>{if(val!=null)OBS[id]=val;};
    put('TEMP', g('temperature_2m'));
    put('TDEW', g('dew_point_2m'));
    put('RH',   g('relative_humidity_2m'));
    put('VPD',  g('vapour_pressure_deficit'));
    put('PSURF',g('surface_pressure'));
    put('CLOUD',g('cloud_cover'));
    const w=g('wind_speed_10m'); if(w!=null)OBS.WIND=w/3.6;
    put('SW',   g('shortwave_radiation'));
    put('ET0',  g('et0_fao_evapotranspiration'));
    put('PREC', g('precipitation'));
    put('SMSH', g('soil_moisture_0_to_7cm'));
    put('SMDP', g('soil_moisture_7_to_28cm'));
    const s=g('sunshine_duration'); if(s!=null)OBS.SUN=s/3600;
    if(typeof tele==='function') tele();
    if(typeof drawStrip==='function') drawStrip();
  }catch(e){}
}

const t0=(y,mo,d,h=0)=>(Date.UTC(y,mo,d,h-7)-EP)/36e5;
const T26=t0(2026,0,1);
const val=(v,t)=>{let s=v.mean;for(let i=0;i<v.T.length;i++){const T=v.T[i];
  s+=T[2]*Math.cos((T[0]*wA+T[1]*wD)*t+T[3]*R2D);}return s;};
const term=(v,k,m)=>v.T.find(t=>t[0]===k&&t[1]===m);
const pkH=v=>{const t=term(v,0,1);return t?((12-t[3]/15)%24+24)%24:12;};
const pkD=v=>{const t=term(v,1,0);if(!t)return 0;
  let tp=-t[3]*R2D/wA; tp+=Math.ceil((T26-tp)/TY)*TY;
  return ((((tp-T26)/24)%365.2422)+365.2422)%365.2422;};
const wr=(a,b,P)=>((a-b+1.5*P)%P)-P/2;
const sdv=a=>{const u=a.reduce((x,y)=>x+y,0)/a.length;
  return Math.sqrt(a.reduce((x,y)=>x+(y-u)**2,0)/a.length)||1;};
const dstr=d=>{const x=new Date(Date.UTC(2026,0,Math.floor(d)+1));
  return x.getUTCDate()+' '+MONS[x.getUTCMonth()];};
const hm=h=>String(Math.floor(h)).padStart(2,'0')+':'+String(Math.round((h%1)*60)%60).padStart(2,'0');

function getEnv(i){
  if(EC[i]) return EC[i];
  const v=V[i], m=new Float64Array(365), r=new Float64Array(365), p=new Float64Array(365);
  for(let d=0;d<365;d++){
    const b=t0(2026,0,d+1);
    let mx=-1e9,mn=1e9,hp=0,s=0;
    for(let h=0;h<48;h++){
      const x=val(v,b+h*0.5); s+=x;
      if(x>mx){mx=x;hp=h*0.5;} if(x<mn)mn=x;
    }
    m[d]=s/48; r[d]=mx-mn; p[d]=hp;
  }
  let mr=0; for(let d=0;d<365;d++) if(r[d]>mr) mr=r[d];
  const sr=sdv(Array.from(r)), sc=new Float64Array(365);
  for(let d=0;d<365;d++){
    const a=(d+4)%365,b=(d+361)%365;
    sc[d]=Math.abs(r[a]-r[b])/sr+Math.abs(wr(p[a],p[b],24))/6;
  }
  const idx=Array.from(sc.keys()).sort((a,b)=>sc[b]-sc[a]), cands=[];
  for(const d of idx){
    if(cands.length<5 && cands.every(e=>Math.min(Math.abs(e-d),365-Math.abs(e-d))>=20)) cands.push(d);
  }
  cands.sort((a,b)=>a-b);
  return EC[i]={m,r,p,mr,cands};
}
const mangsa=d=>{

};

const cv=$('#stage'), g=cv.getContext('2d',{alpha:false});
let VW=0,VH=0,DPR=1,FOC=900,BASE=140;
const CAM={yaw:-0.78,pitch:0.40,dist:6.8,zoom:1};

function prj(p){
  const cy=Math.cos(CAM.yaw), sy=Math.sin(CAM.yaw);
  const x1= p[0]*cy - p[2]*sy;
  const z1= p[0]*sy + p[2]*cy;
  const cp=Math.cos(CAM.pitch), sp=Math.sin(CAM.pitch);
  const y1= p[1]*cp - z1*sp;
  const z2= p[1]*sp + z1*cp;
  const zc= z2 + CAM.dist;
  if(zc<0.25) return null;
  const s=FOC/zc;
  return {x:VW*0.5 + x1*s, y:VH*0.5 - y1*s, z:zc, s};
}
const fog=z=>clamp((CAM.dist+3.4-z)/6.0,0.06,1);
function seg(a,b,col,w,al){
  const A=prj(a),B=prj(b); if(!A||!B) return;
  const f=Math.min(fog(A.z),fog(B.z));
  g.globalAlpha=al*f;
  g.strokeStyle=col;
  g.lineWidth=w*clamp(((A.s+B.s)*0.5)/BASE,0.4,2.4);
  g.beginPath(); g.moveTo(A.x,A.y); g.lineTo(B.x,B.y); g.stroke();
  g.globalAlpha=1;
}
function poly(pts,col,w,al,closed){
  g.strokeStyle=col; g.lineWidth=w; g.globalAlpha=al;
  g.beginPath(); let started=false;
  for(let i=0;i<pts.length;i++){
    const q=prj(pts[i]);
    if(!q){started=false;continue;}
    if(!started){g.moveTo(q.x,q.y);started=true;} else g.lineTo(q.x,q.y);
  }
  if(closed&&started) g.closePath();
  g.stroke(); g.globalAlpha=1;
}
function dot3(p,r,col,glow,al){
  const q=prj(p); if(!q) return null;
  const f=fog(q.z);
  g.globalAlpha=(al===undefined?1:al)*f;
  if(glow){g.shadowColor=col;g.shadowBlur=glow;}
  g.fillStyle=col;
  g.beginPath(); g.arc(q.x,q.y,r*clamp(q.s/BASE,.5,2),0,TAU); g.fill();
  g.shadowBlur=0; g.globalAlpha=1;
  return q;
}
function label3(p,txt,col,sz,dx,dy){
  const q=prj(p); if(!q) return;
  g.globalAlpha=fog(q.z);
  g.fillStyle=col; g.font=sz+'px ui-monospace,Menlo,monospace';
  g.textAlign='left'; g.textBaseline='middle';
  g.fillText(txt,q.x+(dx||0),q.y+(dy||0));
  g.globalAlpha=1;
}
function baseDisc(R0,RA,y){
  for(let k=0;k<=4;k++){
    const r=R0+RA*k/4, pts=[];
    for(let a=0;a<=72;a++){const t=a/72*TAU; pts.push([Math.cos(t)*r,y,Math.sin(t)*r]);}
    poly(pts,'#16305c',1,.65,true);
  }
  for(let k=0;k<12;k++){
    const a=k/12*TAU;
    seg([Math.cos(a)*R0,y,Math.sin(a)*R0],
        [Math.cos(a)*(R0+RA*1.1),y,Math.sin(a)*(R0+RA*1.1)],'#16305c',1,.6);
    label3([Math.cos(a)*(R0+RA*1.26),y,Math.sin(a)*(R0+RA*1.26)],MON[k],'rgba(107,130,173,.9)',9,-8,0);
  }
}
const SLOT_COL=['#5cf2ff','#5cff9d','#c88cff','#ffffff'];

    poly(Q,col,0.7,.22,true);
    g.globalCompositeOperation='lighter';
    for(let d=0;d<365;d++){
      const a=P[d], b=P[(d+1)%365];
      const A=prj(a),B=prj(b); if(!A||!B) continue;
      const f=Math.min(fog(A.z),fog(B.z));
      g.globalAlpha=.8*f;
      g.strokeStyle=col;
      g.lineWidth=1.3*clamp(((A.s+B.s)*0.5)/BASE,.5,2.0);
      g.beginPath(); g.moveTo(A.x,A.y); g.lineTo(B.x,B.y); g.stroke();
    }
    g.globalCompositeOperation='source-over';
    g.globalAlpha=1;
    const a=S.day/365*TAU;
    seg([Math.cos(a)*(R0-.15),YB-.2,Math.sin(a)*(R0-.15)],
        [Math.cos(a)*(R0+RA+.15),YB+HH+.3,Math.sin(a)*(R0+RA+.15)],col,1,.55);
    dot3(P[S.day],3,col,10,.95);
    const q=prj(P[S.day]);
    if(q){
      g.fillStyle=col; g.font='9.5px ui-monospace'; g.textAlign='left';
      g.fillText(v.sym,q.x+16,q.y-4-slot*9);
    }
  }
}

function globe(R){
  for(let lat=-60;lat<=60;lat+=30){
    const ph=lat*R2D, rr=Math.cos(ph)*R, yy=Math.sin(ph)*R, pts=[];
    for(let a=0;a<=72;a++){const t=a/72*TAU; pts.push([Math.cos(t)*rr,yy,Math.sin(t)*rr]);}
    poly(pts,'#1b3a6b',1,.55,true);
  }
  for(let lon=0;lon<180;lon+=30){
    const pts=[];
    for(let a=0;a<=72;a++){
      const t=a/72*TAU;
      pts.push([Math.cos(t)*Math.cos(lon*R2D)*R, Math.sin(t)*R, Math.cos(t)*Math.sin(lon*R2D)*R]);
    }
    poly(pts,'#1b3a6b',1,.5,true);
  }
}
function sceneHar(){

  seg([0,-2.45,0],[0,2.45,0],'#24467e',1,.7);
  seg([-2.6,0,0],[2.6,0,0],'#16305c',1,.45);

    const amp=Math.abs(t1[2])/v.sd;
    const rad=0.62+Math.min(amp,3.2)/3.2*2.25;
    const y=(pkH(v)/24)*2*1.8-1.8;

  for(const n of N){

function sceneSpc(){
  const step=0.44, base=-1.25;
  let gmax=0;
  for(const v of V) for(const t of v.T) if(t[2]>gmax) gmax=t[2];
  const LF=f=>(Math.log10(f)+2.62)/(1.10+2.62);
  const X=f=>LF(f)*4.6-2.3;
  for(let i=0;i<V.length;i++){
    const z=(i-(V.length-1)/2)*step, sel=i===S.sel;
    seg([-2.35,base,z],[2.35,base,z],sel?'rgba(92,242,255,.6)':'rgba(27,58,107,.9)',1,sel?.9:.5);
    label3([-2.42,base,z],V[i].sym,sel?'#fff':'#6b82ad',10,-4,0);
  }
  for(const f of [0.01,0.1,1,10]){
    const x=X(f);
    seg([x,base,-3.3],[x,base,3.3],'rgba(27,58,107,.45)',1,.35);
    label3([x,base-0.28,3.5],String(f).replace('.',','),'rgba(107,130,173,.8)',8.5,-8,0);
  }
  g.globalCompositeOperation='lighter';
  for(let i=0;i<V.length;i++){
    const v=V[i], z=(i-(V.length-1)/2)*step, sel=i===S.sel;
    for(const t of v.T){
      const [k,m,A,ph]=t;
      const f=Math.abs(k/365.2422+m); if(f<=0) continue;
      const x=X(f), h=Math.sqrt(A/gmax)*2.5;
      const col = m===0 ? '#5cf2ff' : (k===0 ? '#ffb347' : '#ff5cc8');
      const a1=prj([x,base,z]), b1=prj([x,base+h,z]);
      if(!a1||!b1) continue;
      const fg=fog(a1.z);
      g.globalAlpha=(sel?1:.34)*fg;
      if(sel){g.shadowColor=col;g.shadowBlur=9;}
      g.strokeStyle=col; g.lineWidth=sel?1.9:1.2;
      g.beginPath(); g.moveTo(a1.x,a1.y); g.lineTo(b1.x,b1.y); g.stroke();
      g.shadowBlur=0;
      if(sel) dot3([x,base+h,z],2.2,col,8,.95);
    }
  }
  g.globalAlpha=1;
  g.globalCompositeOperation='source-over';
  label3([-2.3,base+2.75,0],'AMPLITUDO ↑','rgba(107,130,173,.85)',9,0,0);
  label3([2.5,base-0.28,0],'SIKLUS/HARI →','rgba(107,130,173,.85)',9,-10,0);
  label3([0,base+2.55,-3.4],'● tahunan  ● harian  ● sisi-pita','rgba(107,130,173,.9)',9,0,0);
}

let scanY=0;
function hud(now){
  const m=14,L=34;
  g.strokeStyle='rgba(92,242,255,.45)'; g.lineWidth=1;
  const C=[[m,46,1,1],[VW-m,46,-1,1],[m,VH-m,1,-1],[VW-m,VH-m,-1,-1]];
  for(const [x,y,sx,sy] of C){
    g.beginPath(); g.moveTo(x+sx*L,y); g.lineTo(x,y); g.lineTo(x,y+sy*L); g.stroke();
  }
  scanY=(scanY+0.34)%VH;
  const gr=g.createLinearGradient(0,scanY-40,0,scanY+40);
  gr.addColorStop(0,'rgba(92,242,255,0)');
  gr.addColorStop(.5,'rgba(92,242,255,.05)');
  gr.addColorStop(1,'rgba(92,242,255,0)');
  g.fillStyle=gr; g.fillRect(m,scanY-40,VW-2*m,80);
  const vg=g.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*.34,VW/2,VH/2,Math.max(VW,VH)*.75);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.62)');
  g.fillStyle=vg; g.fillRect(0,0,VW,VH);
  g.strokeStyle='rgba(92,242,255,.14)'; g.lineWidth=1;
  g.beginPath(); g.arc(VW/2,VH/2,3.2,0,TAU); g.stroke();

const sc=$('#strip'), g2=sc.getContext('2d');
let SW=0,SH=0;
function drawStrip(){
  if(!READY||!SW) return;
  const v=V[S.sel], e=getEnv(S.sel);
  const P={l:26,r:8,t:26,b:14};
  const w=SW-P.l-P.r, h=SH-P.t-P.b;
  g2.clearRect(0,0,SW,SH);

  const CL=['#5cf2ff','#ffb347','#ff5cc8'];
  const rH=6, rGap=1, rTop=4;
  for(let r=0;r<3;r++){
    const R=RG[r][1], ac=S.ring===r;
    const ry=rTop+r*(rH+rGap);

    g2.fillStyle = ac ? 'rgba(92,242,255,.10)' : 'rgba(92,242,255,.03)';
    g2.fillRect(P.l, ry, w, rH);

    for(let i=0;i<12;i++){
      const d=((172+Math.round(R[i]))%365+365)%365;
      const px=P.l+(d/365)*w;
      g2.strokeStyle=CL[r];
      g2.globalAlpha = ac?.95:.45;
      g2.beginPath(); g2.moveTo(px, ry); g2.lineTo(px, ry+rH); g2.stroke();
    }
    g2.globalAlpha=1;

    const dx=P.l+(S.day/365)*w;
    g2.strokeStyle='#fff';
    g2.globalAlpha = ac?.95:.35;
    g2.beginPath(); g2.moveTo(dx, ry); g2.lineTo(dx, ry+rH); g2.stroke();
    g2.globalAlpha=1;
  }

  let lo=1e9,hi=-1e9;
  for(let d=0;d<365;d++){
    if(e.m[d]<lo)lo=e.m[d]; if(e.m[d]>hi)hi=e.m[d];
    if(v.ob[d]<lo)lo=v.ob[d]; if(v.ob[d]>hi)hi=v.ob[d];
  }
  const obs=OBS[v.id];
  if(obs!=null){ if(obs<lo)lo=obs; if(obs>hi)hi=obs; }

  const pad=(hi-lo)*.12||1; lo-=pad; hi+=pad;
  const X=d=>P.l+d/364*w, Y=x=>P.t+h-(x-lo)/(hi-lo)*h;
  g2.strokeStyle='rgba(27,58,107,.85)'; g2.lineWidth=1;
  for(let k=0;k<=4;k++){
    const y=P.t+h*k/4;
    g2.beginPath(); g2.moveTo(P.l,y); g2.lineTo(P.l+w,y); g2.stroke();
    g2.fillStyle='rgba(107,130,173,.8)'; g2.font='8px ui-monospace'; g2.textAlign='right';
    g2.fillText((hi-(hi-lo)*k/4).toFixed(1),P.l-5,y+3);
  }
  for(let mth=0;mth<12;mth++){
    const x=X(mth*365/12);
    g2.strokeStyle='rgba(27,58,107,.55)';
    g2.beginPath(); g2.moveTo(x,P.t); g2.lineTo(x,P.t+h); g2.stroke();
    g2.fillStyle='rgba(107,130,173,.75)'; g2.font='8px ui-monospace'; g2.textAlign='center';
    g2.fillText(MON[mth],x,SH-3);
  }
  g2.beginPath(); g2.moveTo(X(0),Y(e.m[0]));
  for(let d=1;d<365;d++) g2.lineTo(X(d),Y(e.m[d]));
  g2.lineTo(X(364),P.t+h); g2.lineTo(X(0),P.t+h); g2.closePath();
  const grd=g2.createLinearGradient(0,P.t,0,P.t+h);
  grd.addColorStop(0,'rgba(92,242,255,.22)'); grd.addColorStop(1,'rgba(92,242,255,0)');
  g2.fillStyle=grd; g2.fill();
  g2.beginPath();
  for(let d=0;d<365;d++){const x=X(d),y=Y(e.m[d]); d?g2.lineTo(x,y):g2.moveTo(x,y);}
  g2.strokeStyle='#5cf2ff'; g2.lineWidth=1.3; g2.shadowColor='#5cf2ff'; g2.shadowBlur=7; g2.stroke(); g2.shadowBlur=0;
  g2.beginPath();
  for(let d=0;d<365;d++){const x=X(d),y=Y(v.ob[d]); d?g2.lineTo(x,y):g2.moveTo(x,y);}
  g2.strokeStyle='rgba(255,179,71,.85)'; g2.lineWidth=1; g2.stroke();
  g2.fillStyle='rgba(255,255,255,.5)';
  for(const d of e.cands){ g2.beginPath(); g2.arc(X(d),P.t+4,2,0,TAU); g2.fill(); }
  const x=X(S.day);
  g2.strokeStyle='#fff'; g2.lineWidth=1.2;
  g2.beginPath(); g2.moveTo(x,P.t-3); g2.lineTo(x,P.t+h+3); g2.stroke();
  g2.fillStyle='#fff'; g2.beginPath(); g2.arc(x,Y(e.m[S.day]),3,0,TAU); g2.fill();
  g2.fillStyle='#ffb347'; g2.beginPath(); g2.arc(x,Y(v.ob[S.day]),2.6,0,TAU); g2.fill();

  if(obs!=null){
    const yClim=Y(e.m[S.day]);
    const yObs =Y(obs);
    const dz=obs-e.m[S.day];
    const col=dz>=0?'#ff5c8a':'#5cf2ff';
    g2.strokeStyle=col; g2.lineWidth=2; g2.globalAlpha=.9;
    g2.beginPath(); g2.moveTo(x,yClim); g2.lineTo(x,yObs); g2.stroke();
    g2.globalAlpha=1;
    g2.fillStyle=col; g2.shadowColor=col; g2.shadowBlur=8;
    g2.beginPath(); g2.arc(x,yObs,3.4,0,TAU); g2.fill();
    g2.shadowBlur=0;
    g2.fillStyle='#fff'; g2.font='bold 8px ui-monospace'; g2.textAlign='left';
    const lbl=(dz>=0?'+':'')+dz.toFixed(2);
    g2.fillText(lbl,x+6,yObs);
  }
}

let drag=null;
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  drag={x:e.clientX,y:e.clientY,mv:0};
});
cv.addEventListener('pointermove',e=>{
  if(!drag) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  drag.x=e.clientX; drag.y=e.clientY; drag.mv+=Math.abs(dx)+Math.abs(dy);
  CAM.yaw+=dx*0.0075;
  CAM.pitch=clamp(CAM.pitch+dy*0.0062,-1.35,1.35);
});
cv.addEventListener('pointerup',e=>{
  if(drag&&drag.mv<7) pick(e.clientX,e.clientY);
  drag=null;
});
cv.addEventListener('pointercancel',()=>drag=null);
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  CAM.zoom=clamp(CAM.zoom*(e.deltaY>0?0.92:1.085),0.42,3.2);
},{passive:false});

function pick(cx,cy){
  if(S.mode!==1) return;
  let best=null,bd=1e9;
  for(let i=0;i<V.length;i++){
    const v=V[i], t1=term(v,1,0); if(!t1) continue;
    const ang=pkD(v)/365.2422*TAU;
    const amp=Math.abs(t1[2])/v.sd;
    const rad=0.62+Math.min(amp,3.2)/3.2*2.25;
    const y=(pkH(v)/24)*2*1.8-1.8;
    const q=prj([Math.cos(ang)*rad,y,Math.sin(ang)*rad]);
    if(!q) continue;
    const d=(q.x-cx)**2+(q.y-cy)**2;
    if(d<bd){bd=d;best=i;}
  }
  if(best!==null&&bd<2600){S.sel=best;syncUI();}
}

function stripPick(e){
  const r=sc.getBoundingClientRect();
  const P={l:26,r:8};
  const w=r.width-P.l-P.r;
  const y=e.clientY-r.top;
  const rH=6, rGap=1, rTop=4;
  const ringsBottom=rTop+3*(rH+rGap);
  if(y>=rTop && y<=ringsBottom){
    for(let k=0;k<3;k++){
      const ry=rTop+k*(rH+rGap);
      if(y>=ry && y<=ry+rH){
        S.ring=k;
        document.querySelectorAll('#rings button').forEach((b,i)=>b.classList.toggle('on',i===k));
        syncUI();
        return;
      }
    }
  }
  S.day=clamp(Math.round((e.clientX-r.left-P.l)/w*364),0,364);
  syncUI();
}
sc.addEventListener('pointerdown',e=>{sc.setPointerCapture(e.pointerId);stripPick(e);});
sc.addEventListener('pointermove',e=>{if(e.buttons)stripPick(e);});

addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){S.day=(S.day+1)%365;syncUI();}
  else if(e.key==='ArrowLeft'){S.day=(S.day+364)%365;syncUI();}
  else if(e.key===' '){e.preventDefault();$('#play').click();}
  else if(e.key>='1'&&e.key<='3'){S.mode=+e.key-1;
    document.querySelectorAll('#modes button').forEach(x=>x.classList.toggle('on',+x.dataset.m===S.mode));syncUI();}
});

function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  VW=window.innerWidth;

  const isMobile = window.innerWidth < 940;
  const topEl = document.getElementById('top');
  const leftEl = document.getElementById('left');
  const rightEl = document.getElementById('right');
  const bottomEl = document.getElementById('bottom');

  const leftRect  = leftEl.getBoundingClientRect();
  const rightRect = rightEl.getBoundingClientRect();
  const topRect   = topEl.getBoundingClientRect();
  const bottomRect= bottomEl.getBoundingClientRect();

  let canvasTop, canvasBottom;
  if(isMobile){
    canvasTop    = Math.round(leftRect.bottom) + 6;
    canvasBottom = Math.round(rightRect.top) - 6;
  } else {
    canvasTop    = Math.round(topRect.bottom) + 10;
    canvasBottom = Math.round(bottomRect.top) - 10;
  }

  VH = Math.max(120, canvasBottom - canvasTop);

  cv.width  = Math.round(VW * DPR);
  cv.height = Math.round(VH * DPR);
  cv.style.width  = VW + 'px';
  cv.style.height = VH + 'px';
  cv.style.top    = canvasTop + 'px';
  cv.style.bottom = 'auto';

  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  FOC  = Math.min(VW, VH) * 0.95;
  BASE = FOC / CAM.dist;

  const r = sc.getBoundingClientRect();
  SW = Math.max(80, Math.floor(r.width));
  SH = Math.max(48, Math.floor(r.height));
  sc.width  = Math.round(SW * DPR);
  sc.height = Math.round(SH * DPR);
  g2.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawStrip();
}
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,250));

let last=performance.now(), acc=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(50,now-last); last=now;

  if(S.spin&&!drag) CAM.yaw+=dt*0.000055;
  if(S.play){
    acc+=dt;
    if(acc>36){acc=0;S.day=(S.day+1)%365;syncUI();}
  }

  g.fillStyle='#02040a'; g.fillRect(0,0,VW,VH);
  const bg=g.createRadialGradient(VW/2,VH*0.42,10,VW/2,VH*0.42,Math.max(VW,VH)*0.78);
  bg.addColorStop(0,'#0a1730'); bg.addColorStop(.55,'#050b18'); bg.addColorStop(1,'#02040a');
  g.fillStyle=bg; g.fillRect(0,0,VW,VH);

  if(READY){
    if(S.mode===0) sceneEnv();
    else if(S.mode===1) sceneHar();
    else sceneSpc();
  }
  hud(now);
}
requestAnimationFrame(frame);

setInterval(()=>{
  const d=new Date();
  $('#clock').textContent=
    String(d.getUTCHours()).padStart(2,'0')+':'+
    String(d.getUTCMinutes()).padStart(2,'0')+':'+
    String(d.getUTCSeconds()).padStart(2,'0');
},1000);
setInterval(()=>{ if(READY&&S.mode!==2) tele(); },4000);

(function init(){
  for(const v of V) for(const t of v.T) if(t[2]>GMAX) GMAX=t[2];
  const now=new Date();
  S.day=Math.floor((Date.now()-Date.UTC(now.getUTCFullYear(),0,1))/864e5)%365;
  if(!(S.day>=0&&S.day<365)) S.day=0;

  buildList();
  READY=true;
  getEnv(S.sel);
  fetchObs();
  setInterval(fetchObs,30*60*1000);
  syncUI();

  requestAnimationFrame(()=>{ resize(); requestAnimationFrame(resize); });
  setTimeout(resize, 300);
  setTimeout(resize, 800);

  setTimeout(()=>{
    const boot=document.getElementById('boot');
    if(boot) boot.classList.add('off');
  }, 350);
})();
</script>
